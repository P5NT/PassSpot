<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Details — Pass Spot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content" id="eventContent"></main>
      </div>
    </div>

    <div class="modal-overlay" id="purchaseModal">
      <div class="modal modal-lg">
        <div class="modal-header">
          <div>
            <h3 class="modal-title">Buy tickets</h3>
            <p class="modal-subtitle" id="purchaseEventName">—</p>
          </div>
          <button
            class="modal-close"
            onclick="PS.closeModal('purchaseModal')"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div id="ticketTypes"></div>
          <div class="divider"></div>
          <div class="summary-row">
            <span>Subtotal</span><span id="checkoutSubtotal">₦0.00</span>
          </div>
          <div class="summary-row">
            <span>Service fee</span><span id="checkoutFee">₦0.00</span>
          </div>
          <div class="summary-row total">
            <span>Total</span><span id="checkoutTotal">₦0.00</span>
          </div>
          <div class="divider"></div>
          <div class="flex justify-between items-center text-sm">
            <span class="text-muted">Wallet balance</span>
            <strong id="checkoutWallet">₦0.00</strong>
          </div>
          <div
            id="insufficientNotice"
            class="info-panel warning mt-4"
            style="display: none"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M10.29 3.86 1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
              />
              <path d="M12 9v4M12 17h.01" />
            </svg>
            <div>
              <strong>Insufficient wallet balance</strong>
              <div style="margin-top: 4px; font-size: var(--fs-xs)">
                Deposit funds to continue.
              </div>
              <a href="deposits.html" class="btn btn-sm btn-primary mt-2"
                >Deposit funds</a
              >
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="PS.closeModal('purchaseModal')"
          >
            Cancel
          </button>
          <button class="btn btn-primary" id="confirmPurchase">
            Confirm purchase
          </button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("events");
        window.PS_SHELL.renderTopbar("Event details");

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get("id") || "evt_001";

        const events =
          window.PS_DATA && typeof PS_DATA.getEvents === "function"
            ? PS_DATA.getEvents()
            : window.PS_DATA.DEMO_EVENTS;
        const ev = events.find((e) => e.id === eventId) || events[0];

        if (!ev) {
          document.getElementById("eventContent").innerHTML =
            `<div class="empty-state"><h3 class="empty-state-title">Event not found</h3><a href="events.html" class="btn btn-primary">Browse events</a></div>`;
          return;
        }

        const cur = PS.getCurrency();
        const isFav = PS.favorites.isFav(ev.id);
        const isOnline = ev.eventType === "online";
        const isFree =
          ev.price === 0 || (ev.ticketTiers && ev.ticketTiers[0]?.price === 0);

        // Handle Media (Image or Emoji)
        const mediaHTML = ev.imageData
          ? `<img src="${ev.imageData}" alt="${ev.title}" style="width:100%;height:100%;object-fit:cover;">`
          : `<div style="display:flex;align-items:center;justify-content:center;font-size:80px;">${ev.emoji || "🎫"}</div>`;

        // Handle Multi-day Schedule Display
        let dateDisplay = "";
        let scheduleCard = "";

        if (ev.schedule && ev.schedule.length > 1) {
          // Multi-day
          const firstDay = new Date(ev.schedule[0].date + "T00:00:00");
          const lastDay = new Date(
            ev.schedule[ev.schedule.length - 1].date + "T00:00:00",
          );
          dateDisplay = `${firstDay.toLocaleDateString("en-NG", { day: "numeric", month: "short" })} → ${lastDay.toLocaleDateString("en-NG", { day: "numeric", month: "short" })}`;

          scheduleCard = `
          <div class="card mb-6">
            <h3 class="card-title mb-3">Daily Schedule (${ev.schedule.length} days)</h3>
            <div class="flex flex-col gap-2">
              ${ev.schedule
                .map((d) => {
                  const dayDate = new Date(d.date + "T00:00:00");
                  return `
                  <div class="flex justify-between items-center" style="padding:var(--space-2) 0; border-bottom:1px solid var(--border-color);">
                    <span class="text-sm">${dayDate.toLocaleDateString("en-NG", { weekday: "long", day: "numeric", month: "long" })}</span>
                    <span class="fw-bold text-primary">${d.startTime}</span>
                  </div>
                `;
                })
                .join("")}
            </div>
          </div>
        `;
        } else {
          // Single day
          dateDisplay = `${PS.formatDate(ev.date)} · ${PS.formatTime(ev.date)}`;
        }

        // Handle Location vs Online
        const locationHTML = isOnline
          ? `<div class="flex items-center gap-2 text-sm text-muted">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.55-2.27a1 1 0 011.45.89v6.76a1 1 0 01-1.45.89L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
             <span>Online Event</span>
           </div>`
          : `<div class="flex items-center gap-2 text-sm text-muted">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
             <span>${ev.venue}, ${ev.city}, ${ev.state.replace(" (FCT)", "")}</span>
           </div>`;

        const mapSection = isOnline
          ? `<div class="card mt-6">
             <h3 class="card-title mb-3">This is an online event</h3>
             <p class="text-sm text-muted">You will receive a link to join the event after purchasing your ticket.</p>
           </div>`
          : `<div class="card mt-6">
             <h3 class="card-title mb-3">Venue & location</h3>
             <p class="text-sm text-muted">${ev.venue}${ev.address ? `, ${ev.address}` : ""}</p>
             <p class="text-sm text-muted">${ev.city}, ${ev.state.replace(" (FCT)", "")}</p>
             <div style="margin-top:var(--space-4);height:180px;background:var(--surface-muted);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:var(--fs-sm);">
               📍 Map preview
             </div>
           </div>`;

        document.getElementById("eventContent").innerHTML = `
        <div class="flex items-center gap-2 mb-4">
          <a href="events.html" class="btn btn-ghost btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to events
          </a>
        </div>

        <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:var(--space-8);" id="eventGrid">
          <div>
            <div style="aspect-ratio:16/9;border-radius:var(--radius-xl);background:linear-gradient(135deg,var(--primary-100),var(--primary-50));overflow:hidden;margin-bottom:var(--space-6);">
              ${mediaHTML}
            </div>

            <div class="flex items-center gap-2 mb-3 flex-wrap">
              ${(ev.categories || [ev.category]).map((c) => `<span class="badge badge-primary">${c}</span>`).join("")}
              ${isOnline ? '<span class="badge badge-info">Online</span>' : ""}
              ${isFree ? '<span class="badge badge-success">Free Entry</span>' : ""}
              ${ev.schedule && ev.schedule.length > 1 ? `<span class="badge badge-neutral">${ev.schedule.length} Days</span>` : ""}
            </div>

            <h1 style="font-size:var(--fs-3xl);margin-bottom:var(--space-4);">${ev.title}</h1>

            <div class="flex gap-6 mb-6" style="flex-wrap:wrap;">
              <div class="flex items-center gap-2 text-sm text-muted">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span>${dateDisplay}</span>
              </div>
              ${locationHTML}
              <div class="flex items-center gap-2 text-sm text-muted">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>By <strong>${ev.organizer}</strong></span>
              </div>
            </div>

            <div class="card mb-6">
              <h3 class="card-title mb-3">About this event</h3>
              <p class="text-sm text-muted" style="line-height:var(--lh-relaxed);">
                ${ev.description || `Join us for an unforgettable experience at ${ev.title}.`}
              </p>
            </div>

            ${scheduleCard}
            ${mapSection}
          </div>

          <div>
            <div class="card" style="position:sticky;top:calc(var(--header-height) + var(--space-4));">
              <div class="card-header" style="margin-bottom:var(--space-4);">
                <div>
                  <div class="text-xs text-muted">Tickets from</div>
                  <div class="stat-value" style="font-size:var(--fs-2xl);">${isFree ? '<span class="text-success">Free</span>' : PS.formatMoney(ev.price, cur)}</div>
                </div>
                <button class="event-card-fav ${isFav ? "is-active" : ""}" id="favBtn" style="position:static;background:var(--surface-muted);">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                </button>
              </div>

              <div class="progress mb-2"><div class="progress-bar" style="width:${(ev.sold / ev.capacity) * 100}%;"></div></div>
              <div class="flex justify-between text-xs text-muted mb-4">
                <span>${ev.sold.toLocaleString()} sold</span>
                <span>${(ev.capacity - ev.sold).toLocaleString()} left</span>
              </div>

              <a href="checkout.html?eventId=${ev.id}" class="btn btn-primary btn-lg btn-block" style="text-align:center;">
                ${isFree ? "Claim Free Tickets" : "Buy Tickets"}
              </a>
            </div>
          </div>
        </div>
      `;

        document.getElementById("favBtn").addEventListener("click", (e) => {
          const now = PS.favorites.toggle(ev.id);
          e.currentTarget.classList.toggle("is-active", now);
          e.currentTarget
            .querySelector("svg")
            .setAttribute("fill", now ? "currentColor" : "none");
          PS.toast(
            now ? "Added to favorites" : "Removed",
            now ? "success" : "info",
          );
        });
      });
    </script>
  </body>
</html>
