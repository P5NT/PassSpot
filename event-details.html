<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Pass Spot</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="dashboard">
    <!-- change per page -->

    <div class="app">
      <!-- SIDEBAR (identical on every dashboard page) -->
      <aside class="sidebar">
        <a href="index.html" class="brand">Pass<span>Spot</span></a>

        <div class="nav-section">
          <div class="nav-label">Main</div>
          <nav class="nav-list">
            <a href="dashboard.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="9" />
                <rect x="14" y="3" width="7" height="5" />
                <rect x="14" y="12" width="7" height="9" />
                <rect x="3" y="16" width="7" height="5" />
              </svg>
              Dashboard
            </a>
            <a href="events.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              Discover Events
            </a>
            <a href="my-tickets.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"
                />
              </svg>
              My Tickets
            </a>
          </nav>
        </div>

        <div class="nav-section">
          <div class="nav-label">Organizer</div>
          <nav class="nav-list">
            <a href="create-event.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Create Event
            </a>
            <a href="my-events.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
              </svg>
              My Events
            </a>
            <a href="analytics.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
              </svg>
              Analytics
            </a>
          </nav>
        </div>

        <div class="nav-section">
          <div class="nav-label">Account</div>
          <nav class="nav-list">
            <a href="notifications.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              Notifications
            </a>
            <a href="profile.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profile
            </a>
            <a href="settings.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              Settings
            </a>
            <a href="help.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              </svg>
              Help & Support
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <a href="#" class="user-mini" data-logout>
            <span class="avatar" data-user-avatar>PS</span>
            <div class="user-meta">
              <div class="user-name" data-user-name>Guest</div>
              <div class="user-role">Sign out</div>
            </div>
          </a>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="main">
        <!-- Header -->
        <header class="header">
          <button class="icon-btn menu-toggle" aria-label="Open menu">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div class="header-title">
            Dashboard
            <span class="sub">Welcome back</span>
          </div>

          <div class="header-search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="search"
              placeholder="Search events, tickets…"
              aria-label="Search"
            />
          </div>

          <div class="header-actions">
            <button
              class="icon-btn"
              data-theme-toggle
              aria-label="Toggle theme"
            ></button>
            <a
              href="notifications.html"
              class="icon-btn"
              aria-label="Notifications"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="dot"></span>
            </a>
            <a href="profile.html" class="avatar" data-user-avatar>PS</a>
          </div>
        </header>

        <!-- PAGE CONTENT GOES HERE -->
        <main class="page" id="event-detail">
          <div class="card card-flush" style="margin-bottom: 24px">
            <div
              style="position: relative; aspect-ratio: 21/9; overflow: hidden"
            >
              <img
                id="ev-image"
                src=""
                alt=""
                style="width: 100%; height: 100%; object-fit: cover"
              />
              <span
                class="badge badge-primary"
                id="ev-cat"
                style="position: absolute; top: 20px; left: 20px"
              ></span>
            </div>
          </div>

          <div
            style="display: grid; grid-template-columns: 1fr 360px; gap: 24px"
            class="event-detail-grid"
          >
            <div>
              <h1 id="ev-title" style="margin-bottom: 12px"></h1>
              <div
                class="event-meta"
                style="
                  flex-direction: row;
                  gap: 20px;
                  flex-wrap: wrap;
                  margin-bottom: 24px;
                "
              >
                <span class="event-meta-row"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                  </svg>
                  <span id="ev-date"></span
                ></span>
                <span class="event-meta-row"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                  </svg>
                  <span id="ev-time"></span
                ></span>
                <span class="event-meta-row"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                  </svg>
                  <span id="ev-venue"></span
                ></span>
              </div>

              <h3 style="margin-bottom: 12px">About this event</h3>
              <p id="ev-desc" style="margin-bottom: 24px"></p>

              <div
                class="card"
                style="display: flex; align-items: center; gap: 16px"
              >
                <span class="avatar avatar-lg" id="ev-org-avatar"></span>
                <div>
                  <div class="muted" style="font-size: 0.75rem">
                    ORGANIZED BY
                  </div>
                  <strong id="ev-org-name"></strong>
                </div>
              </div>
            </div>

            <aside>
              <div class="card" style="position: sticky; top: 88px">
                <div style="display: flex; gap: 8px; margin-bottom: 16px">
                  <button class="btn btn-outline btn-sm" id="ev-share">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <circle cx="18" cy="5" r="3" />
                      <circle cx="6" cy="12" r="3" />
                      <circle cx="18" cy="19" r="3" />
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                    </svg>
                    Share
                  </button>
                  <button class="btn btn-outline btn-sm" id="ev-fav">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                      />
                    </svg>
                    Save
                  </button>
                </div>

                <h4 style="margin-bottom: 16px">Select tickets</h4>
                <div id="ticket-options"></div>

                <div
                  style="
                    border-top: 1px solid var(--border);
                    padding-top: 16px;
                    margin-top: 16px;
                  "
                >
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      font-size: 0.875rem;
                      margin-bottom: 6px;
                    "
                  >
                    <span class="muted">Subtotal</span
                    ><span id="order-subtotal">₦0</span>
                  </div>
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      font-size: 0.875rem;
                      margin-bottom: 12px;
                    "
                  >
                    <span class="muted">Service fee (5%)</span
                    ><span id="order-fee">₦0</span>
                  </div>
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      font-family: var(--font-display);
                      font-weight: 700;
                      font-size: 1.125rem;
                      margin-bottom: 16px;
                    "
                  >
                    <span>Total</span><span id="order-total">₦0</span>
                  </div>
                  <button
                    class="btn btn-primary btn-block btn-lg"
                    id="checkout-btn"
                    disabled
                  >
                    Checkout
                  </button>
                </div>
              </div>
            </aside>
          </div>
        </main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages.js"></script>
  </body>
</html>
