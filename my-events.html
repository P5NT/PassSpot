<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Events — Pass Spot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">My Events</h2>
              <p class="page-subtitle">
                Manage your events, track sales, and assign scanner access.
              </p>
            </div>
            <div class="page-actions">
              <a href="create-event.html" class="btn btn-primary">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Create event
              </a>
            </div>
          </div>

          <section class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total events</span
                ><span class="stat-icon">📅</span>
              </div>
              <div class="stat-value" id="statEvents">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Tickets sold</span
                ><span class="stat-icon success">🎫</span>
              </div>
              <div class="stat-value" id="statSold">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Gross revenue</span
                ><span class="stat-icon warning">💰</span>
              </div>
              <div class="stat-value" id="statRevenue">₦0.00</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Net proceeds</span
                ><span class="stat-icon info">📈</span>
              </div>
              <div class="stat-value" id="statNet">₦0.00</div>
            </div>
          </section>

          <div class="event-grid" id="myEventsGrid"></div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("myEvents");
        window.PS_SHELL.renderTopbar("My Events");

        const myEvents = window.PS_DATA.getEvents().slice(0, 10);

        /* =========================================
         FINANCIAL MATH:
         - Platform Fee (5%): always deducted from organizer
         - Service Fee (2%): deducted from organizer ONLY if they chose "absorb"
         - Net Proceeds = Revenue − Platform Fee − (Service Fee if absorbed)
      ========================================= */
        function renderStats() {
          const totalEvents = myEvents.length;
          const totalSold = myEvents.reduce((s, e) => s + (e.sold || 0), 0);
          const grossRevenue = myEvents.reduce(
            (s, e) => s + (e.price || 0) * (e.sold || 0),
            0,
          );

          const netProceeds = myEvents.reduce((sum, ev) => {
            const revenue = (ev.price || 0) * (ev.sold || 0);
            const feeHandling = ev.feeHandling || "absorb";

            // 1. Platform Fee — 5% (always)
            const platformFeeRate = 0.05;
            const platformFee = revenue * platformFeeRate;

            // 2. Service Fee — 2% (only if absorbed)
            const serviceFeeRate = 0.02;
            const serviceFee =
              feeHandling === "absorb" ? revenue * serviceFeeRate : 0;

            return sum + (revenue - platformFee - serviceFee);
          }, 0);

          document.getElementById("statEvents").textContent = totalEvents;
          document.getElementById("statSold").textContent =
            totalSold.toLocaleString();
          document.getElementById("statRevenue").textContent = PS.formatMoney(
            grossRevenue,
            PS.getCurrency(),
          );
          document.getElementById("statNet").textContent = PS.formatMoney(
            netProceeds,
            PS.getCurrency(),
          );
        }

        function renderEvents() {
          const grid = document.getElementById("myEventsGrid");
          if (myEvents.length === 0) {
            grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              </div>
              <h3 class="empty-state-title">No events yet</h3>
              <p class="empty-state-text">Create your first event to start selling tickets.</p>
              <a href="create-event.html" class="btn btn-primary">Create event</a>
            </div>`;
            return;
          }

          const cur = PS.getCurrency();
          grid.innerHTML = myEvents
            .map((ev) => {
              const revenue = (ev.price || 0) * (ev.sold || 0);
              const pct =
                ev.capacity > 0 ? ((ev.sold || 0) / ev.capacity) * 100 : 0;
              const isOnline = ev.eventType === "online";

              return `
            <article class="event-card">
              <div class="event-card-media" onclick="window.location.href='event-details.html?id=${ev.id}'" style="cursor:pointer;">
                ${
                  ev.imageData
                    ? `<img src="${ev.imageData}" style="width:100%;height:100%;object-fit:cover;">`
                    : `<div class="event-card-media-placeholder">${ev.emoji || "🎫"}</div>`
                }
                <div class="event-card-badges">
                  <span class="badge badge-success">Published</span>
                  ${isOnline ? '<span class="badge badge-info">Online</span>' : ""}
                </div>
              </div>
              <div class="event-card-body">
                <div class="event-card-date">${PS.formatDate(ev.date)}</div>
                <div class="event-card-title">${ev.title}</div>
                <div class="progress" style="margin-top:var(--space-2);">
                  <div class="progress-bar" style="width:${pct}%;"></div>
                </div>
                <div class="flex justify-between text-xs text-muted">
                  <span>${(ev.sold || 0).toLocaleString()} sold</span>
                  <span>${(ev.capacity || 0).toLocaleString()} cap</span>
                </div>
                <div class="event-card-footer" style="padding-top:var(--space-3);border-top:1px solid var(--border-color);flex-wrap:wrap;gap:var(--space-2);">
                  <div class="event-card-price">${PS.formatMoney(revenue, cur)}<span class="event-card-price-label">revenue</span></div>
                  <div class="flex gap-1" style="flex-wrap:wrap;">
                    <a href="edit-event.html?id=${ev.id}" class="btn btn-sm btn-secondary" onclick="event.stopPropagation();">Edit</a>
                    ${
                      ev.hasQA
                        ? `
                      <a href="qa.html?id=${ev.id}" class="btn btn-sm btn-primary" onclick="event.stopPropagation();" target="_blank">View Q/A</a>
                      <button class="btn btn-sm btn-secondary" data-share-qa="${ev.id}" onclick="event.stopPropagation();">Share Q/A</button>
                    `
                        : ""
                    }
                  </div>
                </div>
              </div>
            </article>`;
            })
            .join("");
          attachQAHandlers();
        }

        // Attach share-QA listeners after render
        function attachQAHandlers() {
          document.querySelectorAll("[data-share-qa]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = btn.dataset.shareQa;
              const ev = myEvents.find((e) => e.id === id);
              const qaLink = `${window.location.origin}${window.location.pathname.replace("my-events.html", "qa.html")}?id=${id}`;
              const text = `Ask a question at ${ev.title} on Pass Spot: ${qaLink}`;

              if (navigator.share) {
                try {
                  await navigator.share({ title: ev.title, text, url: qaLink });
                } catch {}
              } else {
                try {
                  await navigator.clipboard.writeText(text);
                  PS.toast("Q/A link copied", "success");
                } catch {
                  PS.toast("Link: " + qaLink, "info");
                }
              }
            });
          });
        }

        document.addEventListener("ps:currencychange", () => {
          renderStats();
          renderEvents();
        });

        renderStats();
        renderEvents();
      });
    </script>
  </body>
</html>
