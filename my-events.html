<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassSpot — My Events</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">My Events</h2>
              <p class="page-subtitle">
                Manage your events, track sales, and view attendees.
              </p>
            </div>
            <div class="page-actions">
              <a href="create-event.html" class="btn btn-primary">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Create event
              </a>
            </div>
          </div>

          <!-- Stats -->
          <section class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total events</span>
                <span class="stat-icon"
                  ><svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <path d="M16 2v4M8 2v4M3 10h18" /></svg
                ></span>
              </div>
              <div class="stat-value" id="statEvents">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Tickets sold</span>
                <span class="stat-icon success"
                  ><svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M2 9a3 3 0 010-6h20a3 3 0 010 6M2 15a3 3 0 000 6h20a3 3 0 000-6M2 9v6M22 9v6"
                    /></svg
                ></span>
              </div>
              <div class="stat-value" id="statSold">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Gross revenue</span>
                <span class="stat-icon warning"
                  ><svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"
                    /></svg
                ></span>
              </div>
              <div class="stat-value" id="statRevenue">₦0.00</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Net proceeds</span>
                <span class="stat-icon info"
                  ><svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M3 3v18h18" />
                    <path d="m19 9-5 5-4-4-3 3" /></svg
                ></span>
              </div>
              <div class="stat-value" id="statNet">₦0.00</div>
            </div>
          </section>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab is-active" data-tab="all">All</button>
            <button class="tab" data-tab="published">Published</button>
            <button class="tab" data-tab="draft">Draft</button>
            <button class="tab" data-tab="completed">Completed</button>
          </div>

          <div class="event-grid" id="myEventsGrid"></div>
        </main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      /* =========================================
       MY EVENTS PAGE
       Organizer view of events with revenue.
    ========================================= */
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("myEvents");
        window.PS_SHELL.renderTopbar("My Events");

        const user = PS.session.getUser();
        // Filter to events created by this organizer (demo: assume all demo events belong to organizer)
        const myEvents = window.PS_DATA.DEMO_EVENTS.slice(0, 6);

        let activeTab = "all";

        function renderStats() {
          const totalEvents = myEvents.length;
          const totalSold = myEvents.reduce((s, e) => s + e.sold, 0);
          const grossRevenue = myEvents.reduce(
            (s, e) => s + e.price * e.sold,
            0,
          );
          const netProceeds = grossRevenue * 0.95; // 5% platform fee demo

          document.getElementById("statEvents").textContent = totalEvents;
          document.getElementById("statSold").textContent =
            totalSold.toLocaleString();
          document.getElementById("statRevenue").textContent = PS.formatMoney(
            grossRevenue,
            PS.getCurrency(),
          );
          document.getElementById("statNet").textContent = PS.formatMoney(
            netProceeds,
            PS.getCurrency(),
          );
        }

        function renderEvents() {
          const grid = document.getElementById("myEventsGrid");
          if (myEvents.length === 0) {
            grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              </div>
              <h3 class="empty-state-title">No events yet</h3>
              <p class="empty-state-text">Create your first event to start selling tickets.</p>
              <a href="create-event.html" class="btn btn-primary">Create event</a>
            </div>`;
            return;
          }

          const cur = PS.getCurrency();
          grid.innerHTML = myEvents
            .map((ev) => {
              const revenue = ev.price * ev.sold;
              const pct = (ev.sold / ev.capacity) * 100;
              return `
            <article class="event-card" onclick="window.location.href='event-details.html?id=${ev.id}'">
              <div class="event-card-media">
                <div class="event-card-media-placeholder">${ev.emoji}</div>
                <div class="event-card-badges">
                  <span class="badge badge-success">Published</span>
                </div>
              </div>
              <div class="event-card-body">
                <div class="event-card-date">${PS.formatDate(ev.date)}</div>
                <div class="event-card-title">${ev.title}</div>
                <div class="progress" style="margin-top:var(--space-2);">
                  <div class="progress-bar" style="width:${pct}%;"></div>
                </div>
                <div class="flex justify-between text-xs text-muted">
                  <span>${ev.sold.toLocaleString()} sold</span>
                  <span>${ev.capacity.toLocaleString()} cap</span>
                </div>
                <div class="event-card-footer">
                  <div class="event-card-price" data-money="${revenue}">${PS.formatMoney(revenue, cur)}<span class="event-card-price-label">revenue</span></div>
                  <div class="dropdown">
                    <button class="btn btn-ghost btn-sm" data-dropdown-toggle onclick="event.stopPropagation();">⋯</button>
                    <div class="dropdown-menu">
                      <a href="analytics.html?eventId=${ev.id}" class="dropdown-item" onclick="event.stopPropagation();">View analytics</a>
                      <a href="create-ad.html?eventId=${ev.id}" class="dropdown-item" onclick="event.stopPropagation();">Promote</a>
                      <button class="dropdown-item danger" onclick="event.stopPropagation();PS.toast('Delete is not available in the demo','warning');">Delete</button>
                    </div>
                  </div>
                </div>
              </div>
            </article>`;
            })
            .join("");
        }

        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            document
              .querySelectorAll(".tab")
              .forEach((t) => t.classList.remove("is-active"));
            tab.classList.add("is-active");
            activeTab = tab.dataset.tab;
            renderEvents();
          });
        });

        document.addEventListener("ps:currencychange", () => {
          renderStats();
          renderEvents();
        });

        renderStats();
        renderEvents();
      });
    </script>
  </body>
</html>
