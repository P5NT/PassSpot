<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advertisements — Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Advertisements</h2>
              <p class="page-subtitle">Review and manage all ad campaigns.</p>
            </div>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>Campaign</th>
                    <th>Budget</th>
                    <th>Spent</th>
                    <th>Status</th>
                    <th>Dates</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminAdsBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="adActionModal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div>
            <h3 class="modal-title" id="adModalTitle">Confirm</h3>
            <p class="modal-subtitle" id="adModalSub">Are you sure?</p>
          </div>
          <button class="modal-close" onclick="PS.closeModal('adActionModal')">
            ✕
          </button>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="PS.closeModal('adActionModal')"
          >
            Cancel
          </button>
          <button class="btn btn-primary" id="confirmAdAction">Confirm</button>
        </div>
      </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!PS.session.requireAdmin()) return;

        window.PS_ADMIN.renderSidebar("advertisements");
        window.PS_ADMIN.renderTopbar("Advertisements");

        const tbody = document.getElementById("adminAdsBody");
        const statusClass = {
          active: "badge-success",
          pending: "badge-warning",
          completed: "badge-neutral",
          rejected: "badge-error",
        };

        function render() {
          const ads = window.PS_DATA.DEMO_ADS;
          const cur = PS.getCurrency();
          tbody.innerHTML = ads
            .map(
              (ad) => `
          <tr>
            <td data-label="Campaign"><div class="fw-semibold text-sm">${ad.eventTitle}</div><div class="text-xs text-muted">${ad.objective}</div></td>
            <td data-label="Budget"><span data-money="${ad.budget}">${PS.formatMoney(ad.budget, cur)}</span></td>
            <td data-label="Spent"><span data-money="${ad.spent}">${PS.formatMoney(ad.spent, cur)}</span></td>
            <td data-label="Status"><span class="badge ${statusClass[ad.status]}">${ad.status}</span></td>
            <td data-label="Dates"><span class="text-xs">${ad.startDate} → ${ad.endDate}</span></td>
            <td data-label="Actions">
              <div class="table-actions">
                ${
                  ad.status === "pending"
                    ? `
                  <button class="btn btn-sm btn-primary" data-action="approve" data-id="${ad.id}">Approve</button>
                  <button class="btn btn-sm btn-ghost" style="color:var(--error-color);" data-action="reject" data-id="${ad.id}">Reject</button>
                `
                    : '<span class="text-xs text-muted">No action</span>'
                }
              </div>
            </td>
          </tr>`,
            )
            .join("");
        }

        tbody.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const ad = window.PS_DATA.DEMO_ADS.find(
            (x) => x.id === btn.dataset.id,
          );
          const action = btn.dataset.action;
          document.getElementById("adModalTitle").textContent =
            `${action === "approve" ? "Approve" : "Reject"} campaign?`;
          document.getElementById("adModalSub").textContent = ad.eventTitle;
          document.getElementById("confirmAdAction").onclick = () => {
            ad.status = action === "approve" ? "active" : "rejected";
            PS.closeModal("adActionModal");
            PS.toast(
              `Campaign ${ad.status}`,
              action === "approve" ? "success" : "info",
            );
            render();
          };
          PS.openModal("adActionModal");
        });

        document.addEventListener("ps:currencychange", render);
        render();
      });
    </script>
  </body>
</html>
