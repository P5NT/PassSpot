<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Logs — Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Audit Logs</h2>
              <p class="page-subtitle">
                Track all platform activity for compliance.
              </p>
            </div>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>Action</th>
                    <th>Actor</th>
                    <th>Target</th>
                    <th>Date & time</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="auditBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!PS.session.requireAdmin()) return;

        window.PS_ADMIN.renderSidebar("audit");
        window.PS_ADMIN.renderTopbar("Audit Logs");

        const logs = [
          {
            action: "Admin approved event",
            actor: "admin@passspot.ng",
            target: "Lagos Music Festival",
            date: "2025-11-28 14:32",
            status: "success",
          },
          {
            action: "Organizer created event",
            actor: "emeka@example.com",
            target: "Tech Founders Summit",
            date: "2025-11-28 12:08",
            status: "success",
          },
          {
            action: "User deposited funds",
            actor: "ada@example.com",
            target: "₦100,000",
            date: "2025-11-28 11:05",
            status: "success",
          },
          {
            action: "Organizer requested withdrawal",
            actor: "soundwave@example.com",
            target: "₦250,000",
            date: "2025-11-28 10:44",
            status: "pending",
          },
          {
            action: "Advertisement approved",
            actor: "admin@passspot.ng",
            target: "AD-002",
            date: "2025-11-27 16:20",
            status: "success",
          },
          {
            action: "User account suspended",
            actor: "admin@passspot.ng",
            target: "chidi@example.com",
            date: "2025-11-27 09:15",
            status: "warning",
          },
          {
            action: "Withdrawal approved",
            actor: "admin@passspot.ng",
            target: "WD-003",
            date: "2025-11-26 17:55",
            status: "success",
          },
        ];

        document.getElementById("auditBody").innerHTML = logs
          .map((l) => {
            const cls = {
              success: "badge-success",
              pending: "badge-warning",
              warning: "badge-warning",
              failed: "badge-error",
            }[l.status];
            return `
          <tr>
            <td data-label="Action"><span class="text-sm fw-medium">${l.action}</span></td>
            <td data-label="Actor"><span class="text-sm text-muted">${l.actor}</span></td>
            <td data-label="Target"><span class="text-sm">${l.target}</span></td>
            <td data-label="Date"><span class="text-sm text-muted">${l.date}</span></td>
            <td data-label="Status"><span class="badge ${cls}">${l.status}</span></td>
          </tr>`;
          })
          .join("");
      });
    </script>
  </body>
</html>
