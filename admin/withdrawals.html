<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Withdrawals — Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Withdrawal requests</h2>
              <p class="page-subtitle">
                Approve or reject organizer withdrawal requests.
              </p>
            </div>
          </div>

          <div class="filter-bar">
            <div class="filter-search">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input
                class="form-input"
                type="search"
                id="wdSearch"
                placeholder="Search requests…"
              />
            </div>
            <select
              class="form-select"
              id="wdStatusFilter"
              style="width: auto; min-width: 150px"
            >
              <option value="">All statuses</option>
              <option>Pending</option>
              <option>Processing</option>
              <option>Approved</option>
              <option>Rejected</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>Request</th>
                    <th>Organizer</th>
                    <th>Amount</th>
                    <th>Bank</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="wdBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="wdActionModal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div>
            <h3 class="modal-title" id="wdModalTitle">Confirm</h3>
            <p class="modal-subtitle" id="wdModalSub">Are you sure?</p>
          </div>
          <button class="modal-close" onclick="PS.closeModal('wdActionModal')">
            ✕
          </button>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="PS.closeModal('wdActionModal')"
          >
            Cancel
          </button>
          <button class="btn btn-primary" id="confirmWdAction">Confirm</button>
        </div>
      </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.PS_ADMIN?.renderSidebar) {
          window.PS_ADMIN.renderSidebar("withdrawals");
          window.PS_ADMIN.renderTopbar("Withdrawals");
        } else {
          document.getElementById("appSidebar").innerHTML =
            `<div class="sidebar-brand"><a href="dashboard.html" class="brand">Pass<span class="brand-accent">Spot</span></a></div>`;
          document.getElementById("appTopbar").innerHTML =
            `<h1 class="topbar-title">Withdrawals</h1>`;
        }

        const requests = [
          {
            id: "WD-001",
            organizer: "SoundWave NG",
            amount: 250000,
            bank: "GTBank",
            account: "****1234",
            status: "Pending",
            date: "2025-11-28",
          },
          {
            id: "WD-002",
            organizer: "Innovate Lagos",
            amount: 85000,
            bank: "Access Bank",
            account: "****5678",
            status: "Processing",
            date: "2025-11-27",
          },
          {
            id: "WD-003",
            organizer: "Edo Heritage",
            amount: 420000,
            bank: "Zenith Bank",
            account: "****9012",
            status: "Approved",
            date: "2025-11-25",
          },
          {
            id: "WD-004",
            organizer: "SportsHub PH",
            amount: 175000,
            bank: "UBA",
            account: "****3456",
            status: "Completed",
            date: "2025-11-20",
          },
          {
            id: "WD-005",
            organizer: "Laugh Factory NG",
            amount: 62000,
            bank: "First Bank",
            account: "****7890",
            status: "Rejected",
            date: "2025-11-18",
          },
        ];

        const tbody = document.getElementById("wdBody");
        const searchEl = document.getElementById("wdSearch");
        const statusEl = document.getElementById("wdStatusFilter");

        const statusClass = {
          Pending: "badge-warning",
          Processing: "badge-info",
          Approved: "badge-success",
          Completed: "badge-neutral",
          Rejected: "badge-error",
        };

        function render() {
          let list = [...requests];
          const q = searchEl.value.toLowerCase();
          if (q)
            list = list.filter(
              (r) =>
                r.organizer.toLowerCase().includes(q) ||
                r.id.toLowerCase().includes(q),
            );
          if (statusEl.value)
            list = list.filter((r) => r.status === statusEl.value);

          const cur = PS.getCurrency();
          tbody.innerHTML = list
            .map(
              (r) => `
          <tr>
            <td data-label="Request"><div class="fw-semibold text-sm mono">${r.id}</div><div class="text-xs text-muted">${r.date}</div></td>
            <td data-label="Organizer"><span class="text-sm">${r.organizer}</span></td>
            <td data-label="Amount"><span class="fw-bold" data-money="${r.amount}">${PS.formatMoney(r.amount, cur)}</span></td>
            <td data-label="Bank"><div class="text-sm">${r.bank}</div><div class="text-xs text-muted">${r.account}</div></td>
            <td data-label="Status"><span class="badge ${statusClass[r.status]}">${r.status}</span></td>
            <td data-label="Actions">
              <div class="table-actions">
                ${
                  r.status === "Pending"
                    ? `
                  <button class="btn btn-sm btn-primary" data-action="approve" data-id="${r.id}">Approve</button>
                  <button class="btn btn-sm btn-ghost" style="color:var(--error-color);" data-action="reject" data-id="${r.id}">Reject</button>
                `
                    : '<span class="text-xs text-muted">No action</span>'
                }
              </div>
            </td>
          </tr>`,
            )
            .join("");
        }

        tbody.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const r = requests.find((x) => x.id === btn.dataset.id);
          const action = btn.dataset.action;
          document.getElementById("wdModalTitle").textContent =
            `${action === "approve" ? "Approve" : "Reject"} withdrawal?`;
          document.getElementById("wdModalSub").textContent =
            `${r.organizer} · ${PS.formatMoney(r.amount, PS.getCurrency())}`;
          document.getElementById("confirmWdAction").onclick = () => {
            r.status = action === "approve" ? "Approved" : "Rejected";
            PS.closeModal("wdActionModal");
            PS.toast(
              `Withdrawal ${r.status.toLowerCase()}`,
              action === "approve" ? "success" : "info",
            );
            render();
          };
          PS.openModal("wdActionModal");
        });

        [searchEl, statusEl].forEach((el) =>
          el.addEventListener("input", render),
        );
        document.addEventListener("ps:currencychange", render);
        render();
      });
    </script>
  </body>
</html>
