<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions — Admin — Pass Spot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Transactions</h2>
              <p class="page-subtitle">
                Monitor all platform-wide financial activity.
              </p>
            </div>
          </div>

          <section class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total transactions</span
                ><span class="stat-icon">📊</span>
              </div>
              <div class="stat-value" id="txTotal">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total in</span
                ><span class="stat-icon success">⬇</span>
              </div>
              <div class="stat-value" id="txIn">₦0.00</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total out</span
                ><span class="stat-icon error">⬆</span>
              </div>
              <div class="stat-value" id="txOut">₦0.00</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Pending</span
                ><span class="stat-icon warning">⏳</span>
              </div>
              <div class="stat-value" id="txPending">0</div>
            </div>
          </section>

          <div class="filter-bar">
            <div class="filter-search">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input
                class="form-input"
                type="search"
                id="txSearch"
                placeholder="Search by ID, description, or reference…"
              />
            </div>
            <select
              class="form-select"
              id="txType"
              style="width: auto; min-width: 170px"
            >
              <option value="">All types</option>
              <option>Deposit</option>
              <option>Withdrawal</option>
              <option>Ticket Purchase</option>
              <option>Ticket Revenue</option>
              <option>Advertisement</option>
              <option>Refund</option>
            </select>
            <select
              class="form-select"
              id="txStatus"
              style="width: auto; min-width: 150px"
            >
              <option value="">All statuses</option>
              <option>Completed</option>
              <option>Pending</option>
              <option>Failed</option>
              <option>Cancelled</option>
              <option>Refunded</option>
            </select>
            <select
              class="form-select"
              id="txSort"
              style="width: auto; min-width: 160px"
            >
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
              <option value="amount-desc">Highest amount</option>
              <option value="amount-asc">Lowest amount</option>
            </select>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>Transaction ID</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Method</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="txBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (!PS.session.requireAdmin()) return;

        window.PS_ADMIN.renderSidebar("transactions");
        window.PS_ADMIN.renderTopbar("Transactions");

        const tbody = document.getElementById("txBody");
        const searchEl = document.getElementById("txSearch");
        const typeEl = document.getElementById("txType");
        const statusEl = document.getElementById("txStatus");
        const sortEl = document.getElementById("txSort");

        const statusClass = {
          completed: "badge-success",
          pending: "badge-warning",
          failed: "badge-error",
          cancelled: "badge-neutral",
          refunded: "badge-info",
        };

        function renderStats() {
          const all = window.PS_DATA.DEMO_TRANSACTIONS;
          const cur = PS.getCurrency();
          const totalIn = all
            .filter((t) => t.amount > 0)
            .reduce((s, t) => s + t.amount, 0);
          const totalOut = all
            .filter((t) => t.amount < 0)
            .reduce((s, t) => s + Math.abs(t.amount), 0);
          const pending = all.filter((t) => t.status === "pending").length;

          document.getElementById("txTotal").textContent = all.length;
          document.getElementById("txIn").textContent = PS.formatMoney(
            totalIn,
            cur,
          );
          document.getElementById("txOut").textContent = PS.formatMoney(
            totalOut,
            cur,
          );
          document.getElementById("txPending").textContent = pending;
        }

        function render() {
          let list = [...window.PS_DATA.DEMO_TRANSACTIONS];
          const q = searchEl.value.trim().toLowerCase();
          if (q) {
            list = list.filter(
              (t) =>
                t.id.toLowerCase().includes(q) ||
                t.description.toLowerCase().includes(q) ||
                t.type.toLowerCase().includes(q),
            );
          }
          if (typeEl.value) list = list.filter((t) => t.type === typeEl.value);
          if (statusEl.value)
            list = list.filter(
              (t) => t.status.toLowerCase() === statusEl.value.toLowerCase(),
            );

          const sort = sortEl.value;
          if (sort === "date-desc")
            list.sort((a, b) => new Date(b.date) - new Date(a.date));
          else if (sort === "date-asc")
            list.sort((a, b) => new Date(a.date) - new Date(b.date));
          else if (sort === "amount-desc")
            list.sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount));
          else if (sort === "amount-asc")
            list.sort((a, b) => Math.abs(a.amount) - Math.abs(b.amount));

          if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state" style="padding:var(--space-8);"><h3 class="empty-state-title">No transactions found</h3><p class="empty-state-text">Try adjusting your filters.</p></div></td></tr>`;
            return;
          }

          const cur = PS.getCurrency();
          tbody.innerHTML = list
            .map((tx) => {
              const isIn = tx.amount > 0;
              return `
            <tr>
              <td data-label="Transaction ID"><span class="mono fw-semibold text-xs">${tx.id}</span></td>
              <td data-label="Description"><span class="text-sm">${tx.description}</span></td>
              <td data-label="Type"><span class="badge badge-neutral">${tx.type}</span></td>
              <td data-label="Amount"><span class="fw-bold ${isIn ? "text-success" : ""}" data-money="${tx.amount}">${PS.formatMoney(tx.amount, cur)}</span></td>
              <td data-label="Status"><span class="badge ${statusClass[tx.status] || "badge-neutral"}">${tx.status}</span></td>
              <td data-label="Method"><span class="text-sm text-muted">${tx.method || "—"}</span></td>
              <td data-label="Date"><span class="text-sm text-muted">${PS.formatDateTime(tx.date)}</span></td>
            </tr>`;
            })
            .join("");
        }

        [searchEl, typeEl, statusEl, sortEl].forEach((el) =>
          el.addEventListener("input", render),
        );
        document.addEventListener("ps:currencychange", () => {
          renderStats();
          render();
        });

        renderStats();
        render();
      });
    </script>
  </body>
</html>
