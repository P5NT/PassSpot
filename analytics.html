<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics — Pass Spot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Revenue bars specific to analytics */
      .rev-bar-container {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .rev-bar-row {
        display: grid;
        grid-template-columns: 1fr 2fr auto;
        gap: var(--space-3);
        align-items: center;
      }
      .rev-bar-label {
        font-size: var(--fs-sm);
        font-weight: var(--fw-medium);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rev-bar-track {
        height: 10px;
        background: var(--surface-subtle);
        border-radius: var(--radius-full);
        overflow: hidden;
      }
      .rev-bar-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--accent-color)
        );
        border-radius: var(--radius-full);
        transition: width var(--transition-slow);
      }
      .rev-bar-value {
        font-size: var(--fs-sm);
        font-weight: var(--fw-bold);
        white-space: nowrap;
      }

      @media (max-width: 540px) {
        .rev-bar-row {
          grid-template-columns: 1fr;
          gap: var(--space-1);
        }
        .rev-bar-value {
          text-align: right;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Analytics</h2>
              <p class="page-subtitle">
                Track your event performance and audience insights.
              </p>
            </div>
          </div>

          <!-- KPI Grid -->
          <section class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total Revenue</span>
                <span class="stat-icon success">💰</span>
              </div>
              <div class="stat-value" id="statRevenue">—</div>
              <div class="stat-change">From all your events</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Tickets Sold</span>
                <span class="stat-icon">🎫</span>
              </div>
              <div class="stat-value" id="statTickets">—</div>
              <div class="stat-change">Across all events</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Active Events</span>
                <span class="stat-icon info">📅</span>
              </div>
              <div class="stat-value" id="statEvents">—</div>
              <div class="stat-change">Currently selling</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Pending Proceeds</span>
                <span class="stat-icon warning">⏳</span>
              </div>
              <div class="stat-value" id="statPending">—</div>
              <div class="stat-change">Awaiting settlement</div>
            </div>
          </section>

          <!-- Revenue per Event Chart -->
          <div class="chart-card mb-6">
            <div class="chart-header">
              <h3 class="chart-title">Revenue by Event</h3>
              <span class="badge badge-primary" id="chartCount">—</span>
            </div>
            <div class="rev-bar-container" id="revBars"></div>
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: var(--space-5);
            "
            id="analyticsGrid"
          >
            <!-- Top Events -->
            <div class="card">
              <h3 class="card-title mb-4">Top events by revenue</h3>
              <div class="tx-list" id="topEventsList"></div>
            </div>

            <!-- Category Breakdown -->
            <div class="card">
              <h3 class="card-title mb-4">Revenue by category</h3>
              <div class="tx-list" id="categoryList"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("analytics");
        window.PS_SHELL.renderTopbar("Analytics");

        const user = PS.session.getUser();
        const allEvents = PS_DATA.getEvents();

        // Filter to only this organizer's events
        const myEvents = allEvents.filter((e) => e.organizer === user.name);

        if (myEvents.length === 0) {
          document.querySelector(".page-content").innerHTML = `
          <div class="empty-state" style="padding:var(--space-16);">
            <div class="empty-state-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            </div>
            <h3 class="empty-state-title">No analytics yet</h3>
            <p class="empty-state-text">Once you create events and sell tickets, your performance data will appear here.</p>
            <a href="create-event.html" class="btn btn-primary">Create your first event</a>
          </div>`;
          return;
        }

        const cur = PS.getCurrency();

        /* =========================================
         CALCULATE STATS
      ========================================= */
        function calculateStats() {
          // 1. Total Revenue (gross)
          const totalRevenue = myEvents.reduce(
            (s, e) => s + e.price * e.sold,
            0,
          );

          // 2. Total Tickets Sold
          const totalTickets = myEvents.reduce((s, e) => s + e.sold, 0);

          // 3. Active Events (future date)
          const now = new Date();
          const activeEvents = myEvents.filter(
            (e) => new Date(e.date) > now,
          ).length;

          // 4. Pending Proceeds (assume 10% of revenue from events in the last 14 days is pending)
          const pendingProceeds = myEvents
            .filter((e) => {
              const daysSince =
                (now - new Date(e.date)) / (1000 * 60 * 60 * 24);
              return daysSince >= 0 && daysSince <= 14;
            })
            .reduce((s, e) => s + e.price * e.sold * 0.1, 0);

          document.getElementById("statRevenue").textContent = PS.formatMoney(
            totalRevenue,
            cur,
          );
          document.getElementById("statTickets").textContent =
            totalTickets.toLocaleString();
          document.getElementById("statEvents").textContent = activeEvents;
          document.getElementById("statPending").textContent = PS.formatMoney(
            pendingProceeds,
            cur,
          );
        }

        /* =========================================
         REVENUE BAR CHART
      ========================================= */
        function renderRevenueChart() {
          // Sort events by revenue (highest first), show top 8
          const sorted = myEvents
            .map((e) => ({ ...e, revenue: e.price * e.sold }))
            .sort((a, b) => b.revenue - a.revenue)
            .slice(0, 8);

          const max = Math.max(...sorted.map((e) => e.revenue), 1);
          const container = document.getElementById("revBars");

          container.innerHTML = sorted
            .map((ev) => {
              const pct = (ev.revenue / max) * 100;
              return `
            <div class="rev-bar-row">
              <span class="rev-bar-label" title="${ev.title}">${ev.title}</span>
              <div class="rev-bar-track">
                <div class="rev-bar-fill" style="width:${pct}%;"></div>
              </div>
              <span class="rev-bar-value">${PS.formatMoney(ev.revenue, cur)}</span>
            </div>
          `;
            })
            .join("");

          document.getElementById("chartCount").textContent =
            `${sorted.length} event${sorted.length !== 1 ? "s" : ""}`;
        }

        /* =========================================
         TOP EVENTS LIST
      ========================================= */
        function renderTopEvents() {
          const sorted = myEvents
            .map((e) => ({ ...e, revenue: e.price * e.sold }))
            .sort((a, b) => b.revenue - a.revenue)
            .slice(0, 5);

          const wrap = document.getElementById("topEventsList");

          wrap.innerHTML = sorted
            .map(
              (ev, idx) => `
          <div class="tx-row" style="cursor:pointer;" onclick="window.location.href='event-details.html?id=${ev.id}'">
            <div class="tx-icon" style="background:${idx === 0 ? "var(--warning-bg)" : "var(--primary-50)"}; color:${idx === 0 ? "var(--warning-color)" : "var(--primary-color)"}; font-weight:var(--fw-bold); font-size:var(--fs-sm);">
              ${idx + 1}
            </div>
            <div class="tx-main">
              <div class="tx-title">${ev.title}</div>
              <div class="tx-meta">${ev.sold} tickets sold</div>
            </div>
            <div class="tx-amount in">${PS.formatMoney(ev.revenue, cur)}</div>
          </div>
        `,
            )
            .join("");
        }

        /* =========================================
         CATEGORY BREAKDOWN
      ========================================= */
        function renderCategoryBreakdown() {
          // Aggregate revenue by category
          const categoryMap = {};
          myEvents.forEach((ev) => {
            const cats = ev.categories || [ev.category];
            const revenue = ev.price * ev.sold;
            cats.forEach((cat) => {
              if (cat) categoryMap[cat] = (categoryMap[cat] || 0) + revenue;
            });
          });

          // Convert to array, sort, calculate percentages
          const total = Object.values(categoryMap).reduce((s, v) => s + v, 0);
          const sorted = Object.entries(categoryMap)
            .map(([name, revenue]) => ({
              name,
              revenue,
              pct: total > 0 ? (revenue / total) * 100 : 0,
            }))
            .sort((a, b) => b.revenue - a.revenue);

          const wrap = document.getElementById("categoryList");

          if (sorted.length === 0) {
            wrap.innerHTML = `<p class="text-sm text-muted" style="padding:var(--space-4); text-align:center;">No categories yet.</p>`;
            return;
          }

          wrap.innerHTML = sorted
            .map(
              (cat) => `
          <div class="tx-row" style="cursor:default;">
            <div class="tx-main">
              <div class="tx-title">${cat.name}</div>
              <div class="progress mt-2">
                <div class="progress-bar" style="width:${cat.pct}%"></div>
              </div>
            </div>
            <div style="text-align:right; min-width:80px;">
              <div class="fw-bold text-sm">${PS.formatMoney(cat.revenue, cur)}</div>
              <div class="text-xs text-muted">${cat.pct.toFixed(1)}%</div>
            </div>
          </div>
        `,
            )
            .join("");
        }

        /* =========================================
         RE-RENDER ON CURRENCY CHANGE
      ========================================= */
        function renderAll() {
          calculateStats();
          renderRevenueChart();
          renderTopEvents();
          renderCategoryBreakdown();
        }

        document.addEventListener("ps:currencychange", renderAll);

        // Initial render
        renderAll();
      });
    </script>
  </body>
</html>
