<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassSpot — My Tickets</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">My Tickets</h2>
              <p class="page-subtitle">
                Your digital tickets for upcoming and past events.
              </p>
            </div>
            <div class="page-actions">
              <a href="events.html" class="btn btn-primary">Discover events</a>
            </div>
          </div>

          <div class="tabs">
            <button class="tab is-active" data-tab="upcoming">Upcoming</button>
            <button class="tab" data-tab="past">Past</button>
            <button class="tab" data-tab="cancelled">Cancelled</button>
          </div>

          <div class="event-grid" id="ticketsGrid"></div>
        </main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      /* =========================================
       MY TICKETS PAGE
    ========================================= */
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("tickets");
        window.PS_SHELL.renderTopbar("My Tickets");

        let activeTab = "upcoming";

        function render() {
          const grid = document.getElementById("ticketsGrid");
          let list = [...window.PS_DATA.DEMO_TICKETS];

          if (activeTab === "upcoming")
            list = list.filter((t) => t.status === "valid");
          else if (activeTab === "past")
            list = list.filter((t) => t.status === "used");
          else if (activeTab === "cancelled")
            list = list.filter((t) => t.status === "cancelled");

          if (list.length === 0) {
            grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 010-6h20a3 3 0 010 6M2 15a3 3 0 000 6h20a3 3 0 000-6M2 9v6M22 9v6"/></svg>
              </div>
              <h3 class="empty-state-title">No ${activeTab} tickets</h3>
              <p class="empty-state-text">Tickets you purchase will appear here.</p>
              <a href="events.html" class="btn btn-primary">Discover events</a>
            </div>`;
            return;
          }

          const cur = PS.getCurrency();
          grid.innerHTML = list
            .map((t) => {
              const ev =
                window.PS_DATA.DEMO_EVENTS.find((e) => e.id === t.eventId) ||
                {};
              const statusBadge = {
                valid: "badge-success",
                used: "badge-neutral",
                cancelled: "badge-error",
              }[t.status];
              const statusLabel = {
                valid: "Valid",
                used: "Used",
                cancelled: "Cancelled",
              }[t.status];
              return `
            <article class="event-card" onclick="window.location.href='ticket-details.html?id=${t.id}'">
              <div class="event-card-media">
                <div class="event-card-media-placeholder">${ev.emoji || "🎫"}</div>
                <div class="event-card-badges">
                  <span class="badge ${statusBadge}">${statusLabel}</span>
                </div>
              </div>
              <div class="event-card-body">
                <div class="event-card-date">${PS.formatDate(t.date)} · ${PS.formatTime(t.date)}</div>
                <div class="event-card-title">${t.eventTitle}</div>
                <div class="event-card-meta">
                  <div class="event-card-meta-row">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    ${t.venue}
                  </div>
                </div>
                <div class="event-card-footer">
                  <div class="event-card-price">${t.ticketType}<span class="event-card-price-label">ticket · ${t.id}</span></div>
                  <span class="badge badge-primary">View</span>
                </div>
              </div>
            </article>`;
            })
            .join("");
        }

        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            document
              .querySelectorAll(".tab")
              .forEach((t) => t.classList.remove("is-active"));
            tab.classList.add("is-active");
            activeTab = tab.dataset.tab;
            render();
          });
        });

        render();
      });
    </script>
  </body>
</html>
