<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassSpot — Campaign</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content" id="adDetailContent"></main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("ads");
        window.PS_SHELL.renderTopbar("Campaign details");

        const params = new URLSearchParams(window.location.search);
        const adId = params.get("id") || window.PS_DATA.DEMO_ADS[0].id;
        const ad =
          window.PS_DATA.DEMO_ADS.find((a) => a.id === adId) ||
          window.PS_DATA.DEMO_ADS[0];
        const cur = PS.getCurrency();

        const statusClass = {
          active: "badge-success",
          pending: "badge-warning",
          completed: "badge-neutral",
          rejected: "badge-error",
          draft: "badge-info",
        };
        const pct = ad.budget > 0 ? (ad.spent / ad.budget) * 100 : 0;

        document.getElementById("adDetailContent").innerHTML = `
        <div class="flex items-center gap-2 mb-4">
          <a href="advertisements.html" class="btn btn-ghost btn-sm">← Back to campaigns</a>
        </div>

        <div class="page-header">
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="badge ${statusClass[ad.status]}">${ad.status}</span>
              <span class="text-xs text-muted mono">${ad.id}</span>
            </div>
            <h2 class="page-title">${ad.eventTitle}</h2>
            <p class="page-subtitle">${ad.objective}</p>
          </div>
          <div class="page-actions">
            ${ad.status === "active" ? "<button class=\"btn btn-secondary\" onclick=\"PS.toast('Pause is not available in the demo','warning')\">Pause campaign</button>" : ""}
            <button class="btn btn-primary" onclick="window.location.href='create-ad.html?eventId=${ad.eventId}'">Create similar</button>
          </div>
        </div>

        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-card-head"><span class="stat-label">Budget</span></div>
            <div class="stat-value" data-money="${ad.budget}">${PS.formatMoney(ad.budget, cur)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-head"><span class="stat-label">Spent</span></div>
            <div class="stat-value" data-money="${ad.spent}">${PS.formatMoney(ad.spent, cur)}</div>
            <div class="stat-change">${pct.toFixed(1)}% of budget</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-head"><span class="stat-label">Impressions</span></div>
            <div class="stat-value">${ad.impressions.toLocaleString()}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-head"><span class="stat-label">Clicks</span></div>
            <div class="stat-value">${ad.clicks.toLocaleString()}</div>
            <div class="stat-change up">CTR ${ad.ctr}%</div>
          </div>
        </section>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);" id="adDetailGrid">
          <div class="chart-card">
            <h3 class="chart-title mb-4">Performance over time</h3>
            <div class="bar-chart" id="adChart"></div>
          </div>

          <div class="card">
            <h3 class="card-title mb-4">Campaign details</h3>
            <div class="summary-row"><span class="text-muted text-sm">Event</span><span class="fw-semibold text-sm">${ad.eventTitle}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">Objective</span><span class="fw-semibold text-sm">${ad.objective}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">Status</span><span class="badge ${statusClass[ad.status]}">${ad.status}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">Start date</span><span class="fw-semibold text-sm">${ad.startDate}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">End date</span><span class="fw-semibold text-sm">${ad.endDate}</span></div>
          </div>
        </div>
      `;

        // Chart
        const data = [30, 55, 40, 68, 85, 72, 90, 62];
        const max = Math.max(...data);
        const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "Mon"];
        document.getElementById("adChart").innerHTML = data
          .map(
            (v, i) => `
        <div class="bar-chart-col">
          <div class="bar-chart-bar" style="height:${(v / max) * 100}%;"></div>
          <span class="bar-chart-label">${days[i]}</span>
        </div>
      `,
          )
          .join("");

        document.addEventListener("ps:currencychange", () => {
          PS.qsa("[data-money]").forEach((el) => {
            el.textContent = PS.formatMoney(
              parseFloat(el.dataset.money),
              PS.getCurrency(),
            );
          });
        });
      });
    </script>
  </body>
</html>
