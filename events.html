<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover Events — Pass Spot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Discover events</h2>
              <p class="page-subtitle">
                Find unforgettable experiences happening across Nigeria.
              </p>
            </div>
            <div class="page-actions">
              <a href="create-event.html" class="btn btn-primary">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Create event
              </a>
            </div>
          </div>

          <div class="category-scroll" id="categoryChips"></div>

          <div class="filter-bar">
            <div class="filter-search">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input
                class="form-input"
                type="search"
                id="searchInput"
                placeholder="Search events, venues, cities…"
              />
            </div>
            <select
              class="form-select"
              id="stateFilter"
              style="width: auto; min-width: 180px"
            >
              <option value="">All Nigeria</option>
            </select>
            <select
              class="form-select"
              id="cityFilter"
              style="width: auto; min-width: 160px"
            >
              <option value="">All cities</option>
            </select>
            <select
              class="form-select"
              id="priceFilter"
              style="width: auto; min-width: 140px"
            >
              <option value="">Any price</option>
              <option value="0-5000">Under ₦5,000</option>
              <option value="5000-15000">₦5,000 – ₦15,000</option>
              <option value="15000-30000">₦15,000 – ₦30,000</option>
              <option value="30000+">₦30,000+</option>
            </select>
            <select
              class="form-select"
              id="sortFilter"
              style="width: auto; min-width: 160px"
            >
              <option value="date">Sort: Date (soonest)</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="popular">Most popular</option>
            </select>
          </div>

          <div class="flex items-center justify-between mb-4">
            <p class="text-sm text-muted" id="resultCount">0 events</p>
          </div>

          <div class="event-grid" id="eventsGrid"></div>
        </main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("events");
        window.PS_SHELL.renderTopbar("Discover events");

        const grid = document.getElementById("eventsGrid");
        const searchInput = document.getElementById("searchInput");
        const stateFilter = document.getElementById("stateFilter");
        const cityFilter = document.getElementById("cityFilter");
        const priceFilter = document.getElementById("priceFilter");
        const sortFilter = document.getElementById("sortFilter");
        const resultCount = document.getElementById("resultCount");
        const chips = document.getElementById("categoryChips");

        let activeCategory = "";
        let activeState = "";
        let activeCity = "";
        let activePrice = "";
        let activeSort = "date";
        let activeSearch = "";

        // Populate states
        window.PS_DATA.NIGERIAN_STATES.forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          stateFilter.appendChild(opt);
        });

        // Chips
        chips.innerHTML =
          `<button class="filter-chip is-active" data-cat="">All</button>` +
          window.PS_DATA.EVENT_CATEGORIES.map(
            (c) => `<button class="filter-chip" data-cat="${c}">${c}</button>`,
          ).join("");

        chips.addEventListener("click", (e) => {
          const chip = e.target.closest(".filter-chip");
          if (!chip) return;
          chips
            .querySelectorAll(".filter-chip")
            .forEach((c) => c.classList.remove("is-active"));
          chip.classList.add("is-active");
          activeCategory = chip.dataset.cat;
          render();
        });

        stateFilter.addEventListener("change", () => {
          activeState = stateFilter.value;
          activeCity = "";
          cityFilter.innerHTML = `<option value="">All cities</option>`;
          const cities = window.PS_DATA.NIGERIAN_CITIES[activeState] || [];
          cities.forEach((c) => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            cityFilter.appendChild(opt);
          });
          render();
        });

        cityFilter.addEventListener("change", () => {
          activeCity = cityFilter.value;
          render();
        });
        priceFilter.addEventListener("change", () => {
          activePrice = priceFilter.value;
          render();
        });
        sortFilter.addEventListener("change", () => {
          activeSort = sortFilter.value;
          render();
        });
        searchInput.addEventListener("input", () => {
          activeSearch = searchInput.value.trim().toLowerCase();
          render();
        });

        function getEvents() {
          return window.PS_DATA && typeof PS_DATA.getEvents === "function"
            ? PS_DATA.getEvents()
            : window.PS_DATA.DEMO_EVENTS;
        }

        function render() {
          let list = [...getEvents()];
          if (activeCategory) {
            list = list.filter((e) => {
              // Check if the event has the new 'categories' array, or fallback to the old 'category' string
              if (e.categories && Array.isArray(e.categories)) {
                return e.categories.includes(activeCategory);
              }
              return e.category === activeCategory;
            });
          }
          if (activeState) list = list.filter((e) => e.state === activeState);
          if (activeCity) list = list.filter((e) => e.city === activeCity);
          if (activePrice) {
            if (activePrice.endsWith("+")) {
              const min = parseInt(activePrice);
              list = list.filter((e) => e.price >= min);
            } else {
              const [min, max] = activePrice.split("-").map(Number);
              list = list.filter((e) => e.price >= min && e.price <= max);
            }
          }
          if (activeSearch) {
            list = list.filter(
              (e) =>
                e.title.toLowerCase().includes(activeSearch) ||
                e.venue.toLowerCase().includes(activeSearch) ||
                e.city.toLowerCase().includes(activeSearch) ||
                e.state.toLowerCase().includes(activeSearch),
            );
          }
          if (activeSort === "date")
            list.sort((a, b) => new Date(a.date) - new Date(b.date));
          else if (activeSort === "price-asc")
            list.sort((a, b) => a.price - b.price);
          else if (activeSort === "price-desc")
            list.sort((a, b) => b.price - a.price);
          else if (activeSort === "popular")
            list.sort((a, b) => b.sold - a.sold);

          resultCount.textContent = `${list.length} event${list.length === 1 ? "" : "s"}`;

          if (list.length === 0) {
            grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </div>
              <h3 class="empty-state-title">No events found</h3>
              <p class="empty-state-text">Try adjusting your search or filters.</p>
            </div>`;
            return;
          }

          const cur = PS.getCurrency();
          grid.innerHTML = list
            .map((ev) => {
              const isFav = PS.favorites.isFav(ev.id);
              const mediaHTML = ev.imageData
                ? `<img src="${ev.imageData}" alt="${ev.title}">`
                : `<div class="event-card-media-placeholder">${ev.emoji || "🎫"}</div>`;
              const multiDay = ev.schedule && ev.schedule.length > 1;
              return `
            <article class="event-card" onclick="window.location.href='event-details.html?id=${ev.id}'">
              <div class="event-card-media">
                ${mediaHTML}
                <div class="event-card-badges">
                  ${ev.trending ? '<span class="badge badge-primary">🔥</span>' : ""}
                  ${ev.featured ? '<span class="badge badge-info">Featured</span>' : ""}
                  ${multiDay ? `<span class="badge badge-neutral">${ev.schedule.length} days</span>` : ""}
                </div>
                <button class="event-card-fav ${isFav ? "is-active" : ""}" data-fav="${ev.id}" onclick="event.stopPropagation();" aria-label="Favorite">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                </button>
              </div>
                            <div class="event-card-body">
                <div class="event-card-date">${multiDay ? `${PS.formatDate(ev.schedule[0].date)} → ${ev.schedule.length} days` : `${PS.formatDate(ev.date)} · ${PS.formatTime(ev.date)}`}</div>
                <div class="event-card-title">${ev.title}</div>
                
                <!-- NEW CATEGORY BADGE -->
                <div class="flex gap-1 flex-wrap mb-2">
                  ${(ev.categories || [ev.category]).map((c) => `<span class="badge badge-primary" style="font-size:10px; padding: 2px 6px;">${c}</span>`).join("")}
                </div>
                <div class="event-card-meta">
                  <div class="event-card-meta-row">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    ${ev.city}, ${ev.state.replace(" (FCT)", "")}
                  </div>
                </div>
                <div class="event-card-footer">
                  <div class="event-card-price">${PS.formatMoney(ev.price, cur)}<span class="event-card-price-label">from</span></div>
                  <span class="badge ${ev.sold / ev.capacity > 0.7 ? "badge-warning" : "badge-success"}">${ev.capacity - ev.sold} left</span>
                </div>
              </div>
            </article>`;
            })
            .join("");

          grid.querySelectorAll("[data-fav]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.fav;
              const nowFav = PS.favorites.toggle(id);
              btn.classList.toggle("is-active", nowFav);
              btn
                .querySelector("svg")
                .setAttribute("fill", nowFav ? "currentColor" : "none");
              PS.toast(
                nowFav ? "Added to favorites" : "Removed",
                nowFav ? "success" : "info",
              );
            });
          });
        }

        render();
        document.addEventListener("ps:currencychange", render);
      });
    </script>
  </body>
</html>
