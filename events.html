<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Pass Spot</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="dashboard">
    <!-- change per page -->

    <div class="app">
      <!-- SIDEBAR (identical on every dashboard page) -->
      <aside class="sidebar">
        <a href="index.html" class="brand">Pass<span>Spot</span></a>

        <div class="nav-section">
          <div class="nav-label">Main</div>
          <nav class="nav-list">
            <a href="dashboard.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="9" />
                <rect x="14" y="3" width="7" height="5" />
                <rect x="14" y="12" width="7" height="9" />
                <rect x="3" y="16" width="7" height="5" />
              </svg>
              Dashboard
            </a>
            <a href="events.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              Discover Events
            </a>
            <a href="my-tickets.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"
                />
              </svg>
              My Tickets
            </a>
          </nav>
        </div>

        <div class="nav-section">
          <div class="nav-label">Organizer</div>
          <nav class="nav-list">
            <a href="create-event.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Create Event
            </a>
            <a href="my-events.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
              </svg>
              My Events
            </a>
            <a href="analytics.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
              </svg>
              Analytics
            </a>
          </nav>
        </div>

        <div class="nav-section">
          <div class="nav-label">Account</div>
          <nav class="nav-list">
            <a href="notifications.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              Notifications
            </a>
            <a href="profile.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profile
            </a>
            <a href="settings.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              Settings
            </a>
            <a href="help.html" class="nav-item">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              </svg>
              Help & Support
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <a href="#" class="user-mini" data-logout>
            <span class="avatar" data-user-avatar>PS</span>
            <div class="user-meta">
              <div class="user-name" data-user-name>Guest</div>
              <div class="user-role">Sign out</div>
            </div>
          </a>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="main">
        <!-- Header -->
        <header class="header">
          <button class="icon-btn menu-toggle" aria-label="Open menu">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div class="header-title">
            Dashboard
            <span class="sub">Welcome back</span>
          </div>

          <div class="header-search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="search"
              placeholder="Search events, tickets…"
              aria-label="Search"
            />
          </div>

          <div class="header-actions">
            <button
              class="icon-btn"
              data-theme-toggle
              aria-label="Toggle theme"
            ></button>
            <a
              href="notifications.html"
              class="icon-btn"
              aria-label="Notifications"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="dot"></span>
            </a>
            <a href="profile.html" class="avatar" data-user-avatar>PS</a>
          </div>
        </header>

        <!-- PAGE CONTENT GOES HERE -->
        <main class="page">
          <div class="page-header">
            <h1>Discover Events</h1>
            <p>Find your next experience across Nigeria.</p>
          </div>

          <!-- Search + filters -->
          <div class="filters">
            <div class="input-icon-wrap" style="flex: 1; min-width: 240px">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                id="event-search"
                class="form-control"
                type="search"
                placeholder="Search events, venues, cities…"
              />
            </div>
            <select id="filter-location" class="form-control">
              <option value="">All locations</option>
              <option>Lagos</option>
              <option>Abuja</option>
              <option>Port Harcourt</option>
              <option>Ibadan</option>
              <option>Benin City</option>
              <option>Enugu</option>
            </select>
            <select id="filter-price" class="form-control">
              <option value="">Any price</option>
              <option value="free">Free</option>
              <option value="under25">Under ₦25,000</option>
              <option value="25to75">₦25,000 – ₦75,000</option>
              <option value="over75">Over ₦75,000</option>
            </select>
            <select id="filter-sort" class="form-control">
              <option value="date-asc">Soonest first</option>
              <option value="date-desc">Latest first</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </div>

          <!-- Category chips -->
          <div
            class="chip-row"
            id="cat-chips"
            style="margin-bottom: 24px"
          ></div>

          <div class="page-header-row" style="margin-bottom: 16px">
            <span class="muted" id="result-count"></span>
          </div>

          <div class="events-grid" id="events-grid"></div>
        </main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages.js"></script>
  </body>
</html>
