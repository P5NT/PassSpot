<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassSpot — Create Advertisement</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>
        <main class="page-content">
          <div class="page-header">
            <div>
              <h2 class="page-title">Create advertisement</h2>
              <p class="page-subtitle">
                Launch a campaign to promote your event.
              </p>
            </div>
          </div>

          <!-- Stepper -->
          <div class="stepper" id="stepper">
            <div class="step is-active" data-step="1">
              <span class="step-number">1</span
              ><span class="step-label">Event</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" data-step="2">
              <span class="step-number">2</span
              ><span class="step-label">Objective</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" data-step="3">
              <span class="step-number">3</span
              ><span class="step-label">Audience</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" data-step="4">
              <span class="step-number">4</span
              ><span class="step-label">Budget</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" data-step="5">
              <span class="step-number">5</span
              ><span class="step-label">Duration</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" data-step="6">
              <span class="step-number">6</span
              ><span class="step-label">Preview</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" data-step="7">
              <span class="step-number">7</span
              ><span class="step-label">Payment</span>
            </div>
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: 1.6fr 1fr;
              gap: var(--space-8);
            "
            id="adGrid"
          >
            <div id="adForm"></div>
            <div>
              <div
                class="card"
                style="
                  position: sticky;
                  top: calc(var(--header-height) + var(--space-4));
                "
              >
                <h3 class="card-title mb-4">Campaign summary</h3>
                <div class="summary-row">
                  <span class="text-muted text-sm">Event</span
                  ><span class="fw-semibold text-sm" id="sumEvent">—</span>
                </div>
                <div class="summary-row">
                  <span class="text-muted text-sm">Objective</span
                  ><span class="fw-semibold text-sm" id="sumObjective">—</span>
                </div>
                <div class="summary-row">
                  <span class="text-muted text-sm">Budget</span
                  ><span class="fw-semibold text-sm" id="sumBudget">—</span>
                </div>
                <div class="summary-row">
                  <span class="text-muted text-sm">Duration</span
                  ><span class="fw-semibold text-sm" id="sumDuration">—</span>
                </div>
                <div class="summary-row total">
                  <span>Cost</span><span id="sumCost">₦0.00</span>
                </div>
                <div class="divider"></div>
                <div class="summary-row">
                  <span class="text-muted text-sm">Wallet balance</span
                  ><span class="fw-semibold text-sm" id="sumWallet">₦0.00</span>
                </div>
                <div
                  id="insufficientAd"
                  class="info-panel warning mt-3"
                  style="display: none"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M10.29 3.86 1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
                    />
                  </svg>
                  <span
                    >Insufficient balance.
                    <a
                      href="deposits.html"
                      style="color: inherit; text-decoration: underline"
                      >Deposit funds</a
                    ></span
                  >
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      /* =========================================
       CREATE AD — MULTI-STEP CAMPAIGN BUILDER
    ========================================= */
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("ads");
        window.PS_SHELL.renderTopbar("Create advertisement");

        const params = new URLSearchParams(window.location.search);
        const preselectEvent = params.get("eventId");

        const campaign = {
          eventId: preselectEvent || "",
          objective: "",
          location: "",
          ageRange: "",
          interests: "",
          dailyBudget: "",
          totalBudget: "",
          duration: "",
          startDate: "",
          endDate: "",
        };

        let step = 1;

        const events = window.PS_DATA.DEMO_EVENTS;

        const steps = {
          1: () => `
          <div class="card">
            <h3 class="card-title mb-4">Select the event you want to promote</h3>
            <div style="display:grid;gap:var(--space-3);">
              ${events
                .slice(0, 8)
                .map(
                  (ev) => `
                <label class="radio-card" style="cursor:pointer;">
                  <input type="radio" name="adEvent" value="${ev.id}" ${campaign.eventId === ev.id ? "checked" : ""}>
                  <div class="radio-card-content" style="display:flex;align-items:center;gap:12px;">
                    <div style="font-size:24px;">${ev.emoji}</div>
                    <div style="flex:1;">
                      <div class="radio-card-title">${ev.title}</div>
                      <div class="radio-card-desc">${ev.city}, ${ev.state.replace(" (FCT)", "")} · ${PS.formatDate(ev.date)}</div>
                    </div>
                  </div>
                </label>
              `,
                )
                .join("")}
            </div>
          </div>
        `,
          2: () => `
          <div class="card">
            <h3 class="card-title mb-4">What's your campaign goal?</h3>
            <div style="display:grid;gap:var(--space-3);">
              ${[
                {
                  v: "Increase Ticket Sales",
                  d: "Drive more ticket purchases",
                  e: "🎟️",
                },
                {
                  v: "Increase Event Awareness",
                  d: "Boost brand and event reach",
                  e: "📣",
                },
                {
                  v: "Increase Event Page Visits",
                  d: "Get more people to your event page",
                  e: "🔗",
                },
              ]
                .map(
                  (o) => `
                <label class="radio-card" style="cursor:pointer;">
                  <input type="radio" name="adObjective" value="${o.v}" ${campaign.objective === o.v ? "checked" : ""}>
                  <div class="radio-card-content" style="display:flex;gap:12px;align-items:center;">
                    <div style="font-size:24px;">${o.e}</div>
                    <div>
                      <div class="radio-card-title">${o.v}</div>
                      <div class="radio-card-desc">${o.d}</div>
                    </div>
                  </div>
                </label>
              `,
                )
                .join("")}
            </div>
          </div>
        `,
          3: () => `
          <div class="card">
            <h3 class="card-title mb-4">Audience targeting</h3>
            <div class="form-group">
              <label class="form-label">Location</label>
              <select class="form-select" id="adLocation">
                <option value="">All Nigeria</option>
                ${window.PS_DATA.NIGERIAN_STATES.map((s) => `<option ${campaign.location === s ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Age range</label>
              <select class="form-select" id="adAge">
                <option value="">Any age</option>
                <option ${campaign.ageRange === "18-24" ? "selected" : ""}>18-24</option>
                <option ${campaign.ageRange === "25-34" ? "selected" : ""}>25-34</option>
                <option ${campaign.ageRange === "35-44" ? "selected" : ""}>35-44</option>
                <option ${campaign.ageRange === "45+" ? "selected" : ""}>45+</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Interests</label>
              <input class="form-input" type="text" id="adInterests" placeholder="e.g. Music, Technology, Sports" value="${campaign.interests}">
              <span class="form-hint">Separate multiple interests with commas.</span>
            </div>
          </div>
        `,
          4: () => `
          <div class="card">
            <h3 class="card-title mb-4">Budget</h3>
            <div class="form-group">
              <label class="form-label">Daily budget</label>
              <div class="input-group">
                <span class="input-prefix">₦</span>
                <input class="form-input" type="number" id="adDaily" min="1000" placeholder="5,000" value="${campaign.dailyBudget}">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Total campaign budget <span class="required">*</span></label>
              <div class="input-group">
                <span class="input-prefix">₦</span>
                <input class="form-input" type="number" id="adTotal" min="5000" placeholder="50,000" value="${campaign.totalBudget}" required>
              </div>
              <span class="form-hint">Minimum ₦5,000. This amount will be deducted from your wallet.</span>
              <span class="form-error"></span>
            </div>
          </div>
        `,
          5: () => `
          <div class="card">
            <h3 class="card-title mb-4">Campaign duration</h3>
            <div class="auth-form-row">
              <div class="form-group">
                <label class="form-label">Start date</label>
                <input class="form-input" type="date" id="adStart" value="${campaign.startDate}">
              </div>
              <div class="form-group">
                <label class="form-label">End date</label>
                <input class="form-input" type="date" id="adEnd" value="${campaign.endDate}">
              </div>
            </div>
          </div>
        `,
          6: () => `
          <div class="card">
            <h3 class="card-title mb-4">Preview</h3>
            <div style="border:1px dashed var(--border-color);border-radius:var(--radius-md);padding:var(--space-4);background:var(--surface-muted);">
              <div class="text-xs text-muted mb-2">SPONSORED</div>
              <div class="event-card" style="box-shadow:none;border:1px solid var(--border-color);">
                <div class="event-card-media">
                  <div class="event-card-media-placeholder">${(events.find((e) => e.id === campaign.eventId) || {}).emoji || "🎫"}</div>
                </div>
                <div class="event-card-body">
                  <div class="event-card-title">${(events.find((e) => e.id === campaign.eventId) || {}).title || "Event"}</div>
                  <div class="event-card-meta">
                    <div class="event-card-meta-row">📍 ${campaign.location || "All Nigeria"}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `,
          7: () => `
          <div class="card">
            <h3 class="card-title mb-4">Review & payment</h3>
            <div class="summary-row"><span class="text-muted text-sm">Event</span><span class="fw-semibold text-sm">${(events.find((e) => e.id === campaign.eventId) || {}).title || "—"}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">Objective</span><span class="fw-semibold text-sm">${campaign.objective || "—"}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">Location</span><span class="fw-semibold text-sm">${campaign.location || "All Nigeria"}</span></div>
            <div class="summary-row"><span class="text-muted text-sm">Duration</span><span class="fw-semibold text-sm">${campaign.startDate || "—"} → ${campaign.endDate || "—"}</span></div>
            <div class="divider"></div>
            <div class="summary-row total"><span>Total cost</span><span>${PS.formatMoney(parseFloat(campaign.totalBudget) || 0, PS.getCurrency())}</span></div>
            <div class="info-panel success mt-4">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
              <span>Amount will be deducted from your Pass Spot wallet on confirmation.</span>
            </div>
          </div>
        `,
        };

        function render() {
          document.getElementById("adForm").innerHTML = steps[step]();
          document.querySelectorAll(".step").forEach((s) => {
            s.classList.toggle("is-active", parseInt(s.dataset.step) === step);
            s.classList.toggle("is-done", parseInt(s.dataset.step) < step);
          });

          // Bind inputs
          if (step === 1) {
            document.querySelectorAll('input[name="adEvent"]').forEach((r) =>
              r.addEventListener("change", () => {
                campaign.eventId = r.value;
                updateSummary();
              }),
            );
          }
          if (step === 2) {
            document
              .querySelectorAll('input[name="adObjective"]')
              .forEach((r) =>
                r.addEventListener("change", () => {
                  campaign.objective = r.value;
                  updateSummary();
                }),
              );
          }
          if (step === 3) {
            document
              .getElementById("adLocation")
              .addEventListener("change", (e) => {
                campaign.location = e.target.value;
                updateSummary();
              });
            document.getElementById("adAge").addEventListener("change", (e) => {
              campaign.ageRange = e.target.value;
            });
            document
              .getElementById("adInterests")
              .addEventListener("input", (e) => {
                campaign.interests = e.target.value;
              });
          }
          if (step === 4) {
            document
              .getElementById("adDaily")
              .addEventListener("input", (e) => {
                campaign.dailyBudget = e.target.value;
                updateSummary();
              });
            document
              .getElementById("adTotal")
              .addEventListener("input", (e) => {
                campaign.totalBudget = e.target.value;
                updateSummary();
              });
          }
          if (step === 5) {
            document
              .getElementById("adStart")
              .addEventListener("change", (e) => {
                campaign.startDate = e.target.value;
                updateSummary();
              });
            document.getElementById("adEnd").addEventListener("change", (e) => {
              campaign.endDate = e.target.value;
              updateSummary();
            });
          }

          // Navigation
          const nav = document.createElement("div");
          nav.className = "flex justify-between mt-6 gap-3";
          nav.style.flexWrap = "wrap";
          nav.innerHTML = `
          <button class="btn btn-secondary" id="prevBtn" ${step === 1 ? "disabled" : ""}>← Back</button>
          <button class="btn btn-primary" id="nextBtn">${step === 7 ? "Pay & launch campaign" : "Continue →"}</button>
        `;
          document.getElementById("adForm").appendChild(nav);

          document.getElementById("prevBtn").addEventListener("click", () => {
            if (step > 1) {
              step--;
              render();
            }
          });
          document.getElementById("nextBtn").addEventListener("click", () => {
            if (!validateStep()) return;
            if (step === 7) {
              submitCampaign();
              return;
            }
            step++;
            render();
          });

          updateSummary();
        }

        function validateStep() {
          if (step === 1 && !campaign.eventId) {
            PS.toast("Select an event first", "error");
            return false;
          }
          if (step === 2 && !campaign.objective) {
            PS.toast("Choose a campaign objective", "error");
            return false;
          }
          if (step === 4) {
            const total = parseFloat(campaign.totalBudget);
            if (!total || total < 5000) {
              PS.toast("Minimum budget is ₦5,000", "error");
              return false;
            }
          }
          if (step === 5) {
            if (!campaign.startDate || !campaign.endDate) {
              PS.toast("Select start and end dates", "error");
              return false;
            }
            if (new Date(campaign.endDate) <= new Date(campaign.startDate)) {
              PS.toast("End date must be after start date", "error");
              return false;
            }
          }
          return true;
        }

        function updateSummary() {
          const cur = PS.getCurrency();
          const ev = events.find((e) => e.id === campaign.eventId);
          document.getElementById("sumEvent").textContent = ev ? ev.title : "—";
          document.getElementById("sumObjective").textContent =
            campaign.objective || "—";
          document.getElementById("sumBudget").textContent =
            campaign.totalBudget
              ? PS.formatMoney(parseFloat(campaign.totalBudget), cur)
              : "—";
          document.getElementById("sumDuration").textContent =
            campaign.startDate && campaign.endDate
              ? `${campaign.startDate} → ${campaign.endDate}`
              : "—";
          document.getElementById("sumCost").textContent = PS.formatMoney(
            parseFloat(campaign.totalBudget) || 0,
            cur,
          );
          document.getElementById("sumWallet").textContent = PS.formatMoney(
            PS.wallet.getBalance(),
            cur,
          );

          const insufficient =
            parseFloat(campaign.totalBudget) > PS.wallet.getBalance();
          document.getElementById("insufficientAd").style.display = insufficient
            ? "flex"
            : "none";
        }

        function submitCampaign() {
          const cost = parseFloat(campaign.totalBudget);
          if (cost > PS.wallet.getBalance()) {
            PS.toast("Insufficient wallet balance", "error");
            return;
          }
          const btn = document.getElementById("nextBtn");
          btn.classList.add("is-loading");
          btn.disabled = true;

          setTimeout(() => {
            PS.wallet.deduct(cost);
            // Save campaign
            const ads = window.PS_DATA.DEMO_ADS;
            ads.push({
              id: "AD-" + Date.now().toString().slice(-6),
              eventId: campaign.eventId,
              eventTitle:
                (events.find((e) => e.id === campaign.eventId) || {}).title ||
                "Event",
              status: "pending",
              budget: cost,
              spent: 0,
              impressions: 0,
              clicks: 0,
              ctr: 0,
              startDate: campaign.startDate,
              endDate: campaign.endDate,
              objective: campaign.objective,
            });
            PS.toast("Campaign submitted for review!", "success");
            setTimeout(() => {
              window.location.href = "advertisements.html";
            }, 800);
          }, 1200);
        }

        document.addEventListener("ps:currencychange", updateSummary);
        render();
      });
    </script>
  </body>
</html>
