<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Pass Spot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C2BD9'/%3E%3Cpath d='M10 22V10h6.5a4 4 0 010 8H13v4h-3zm3-7h3a1.5 1.5 0 000-3h-3v3z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="sidebar-overlay"></div>

      <div class="main-area">
        <header class="topbar" id="appTopbar"></header>

        <main class="page-content" id="dashContent"></main>
      </div>
    </div>

    <div class="modal-overlay" id="logoutModal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div>
            <h3 class="modal-title">Log out of Pass Spot?</h3>
            <p class="modal-subtitle">You can log back in anytime.</p>
          </div>
          <button
            class="modal-close"
            onclick="PS.closeModal('logoutModal')"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="PS.closeModal('logoutModal')"
          >
            Cancel
          </button>
          <button class="btn btn-danger" id="confirmLogout">Log out</button>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.PS_SHELL.renderSidebar("dashboard");
        window.PS_SHELL.renderTopbar("Dashboard");

        const user = PS.session.getUser();
        const isOrganizer = PS.session.isOrganizer();
        const firstName = user.name.split(" ")[0];
        const content = document.getElementById("dashContent");

        // =========================================
        // DASHBOARD LAYOUT — ROLE-AWARE
        // Attendee sees buy-side stats and focus.
        // Organizer sees sales-side stats and focus.
        // =========================================
        if (isOrganizer) {
          renderOrganizerDashboard();
        } else {
          renderAttendeeDashboard();
        }

        // =========================================
        // ATTENDEE DASHBOARD
        // =========================================
        function renderAttendeeDashboard() {
          content.innerHTML = `
          <div class="page-header">
            <div>
              <h2 class="page-title">Welcome back, ${firstName} 👋</h2>
              <p class="page-subtitle">Here's what's happening with your Pass Spot account.</p>
            </div>
            <div class="page-actions">
              <a href="events.html" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Discover events
              </a>
            </div>
          </div>

          <section class="balance-hero">
            <div class="balance-hero-content">
              <div class="balance-label">Wallet Balance</div>
              <div class="balance-amount" id="heroBalance">—</div>
              <div class="balance-split">
                <div class="balance-split-item">
                  <span class="balance-split-label">Available</span>
                  <span class="balance-split-value" id="heroAvailable">—</span>
                </div>
                <div class="balance-split-item">
                  <span class="balance-split-label">Pending</span>
                  <span class="balance-split-value" id="heroPending">—</span>
                </div>
              </div>
              <div class="balance-actions">
                <a href="deposits.html" class="btn btn-white">Deposit</a>
                <a href="wallet.html" class="btn btn-secondary">View transactions</a>
              </div>
            </div>
          </section>

          <section class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Tickets Purchased</span>
                <span class="stat-icon">🎫</span>
              </div>
              <div class="stat-value">${window.PS_DATA.DEMO_TICKETS.length}</div>
              <div class="stat-change up">↑ 1 this month</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Total Spent</span>
                <span class="stat-icon warning">💰</span>
              </div>
              <div class="stat-value" data-money="90000">—</div>
              <div class="stat-change up">Across 3 events</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Events Attended</span>
                <span class="stat-icon success">✅</span>
              </div>
              <div class="stat-value">1</div>
              <div class="stat-change up">2 upcoming</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Favorite Events</span>
                <span class="stat-icon error">❤</span>
              </div>
              <div class="stat-value" id="favCount">0</div>
              <div class="stat-change">Saved events</div>
            </div>
          </section>

          <section class="mt-8">
            <div class="section-header">
              <div>
                <h3 class="section-title" style="font-size:var(--fs-xl);">Your upcoming events</h3>
                <p class="section-subtitle">Events you've purchased tickets for.</p>
              </div>
              <a href="my-tickets.html" class="btn btn-ghost btn-sm">View all tickets →</a>
            </div>
            <div class="event-grid" id="upcomingEvents"></div>
          </section>

          <section class="mt-8">
            <div class="section-header">
              <div>
                <h3 class="section-title" style="font-size:var(--fs-xl);">Recommended for you</h3>
                <p class="section-subtitle">Trending events based on your interests.</p>
              </div>
              <a href="events.html" class="btn btn-ghost btn-sm">Explore all →</a>
            </div>
            <div class="event-grid" id="recommendedEvents"></div>
          </section>

          <section class="mt-8">
            <div class="section-header">
              <div>
                <h3 class="section-title" style="font-size:var(--fs-xl);">Recent activity</h3>
                <p class="section-subtitle">Your last few wallet transactions.</p>
              </div>
              <a href="wallet.html" class="btn btn-ghost btn-sm">View all →</a>
            </div>
            <div class="table-wrap">
              <div class="tx-list" id="recentTransactions"></div>
            </div>
          </section>
        `;

          bindAttendeeLogic();
        }

        // =========================================
        // ORGANIZER DASHBOARD
        // =========================================
        function renderOrganizerDashboard() {
          const myEvents = window.PS_DATA.DEMO_EVENTS.slice(0, 6);
          const totalSold = myEvents.reduce((s, e) => s + e.sold, 0);
          const grossRevenue = myEvents.reduce(
            (s, e) => s + e.price * e.sold,
            0,
          );
          const netProceeds = grossRevenue * 0.95;

          content.innerHTML = `
          <div class="page-header">
            <div>
              <h2 class="page-title">Welcome back, ${firstName} 👋</h2>
              <p class="page-subtitle">Here's how your events are performing.</p>
            </div>
            <div class="page-actions">
              <a href="create-event.html" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                Create event
              </a>
            </div>
          </div>

          <section class="balance-hero">
            <div class="balance-hero-content">
              <div class="balance-label">Net Proceeds (available)</div>
              <div class="balance-amount" data-money="${netProceeds}">—</div>
              <div class="balance-split">
                <div class="balance-split-item">
                  <span class="balance-split-label">Gross Sales</span>
                  <span class="balance-split-value" data-money="${grossRevenue}">—</span>
                </div>
                <div class="balance-split-item">
                  <span class="balance-split-label">Tickets Sold</span>
                  <span class="balance-split-value">${totalSold.toLocaleString()}</span>
                </div>
                <div class="balance-split-item">
                  <span class="balance-split-label">Events</span>
                  <span class="balance-split-value">${myEvents.length}</span>
                </div>
              </div>
              <div class="balance-actions">
                <a href="withdrawals.html" class="btn btn-white">Withdraw earnings</a>
                <a href="analytics.html" class="btn btn-secondary">View analytics</a>
              </div>
            </div>
          </section>

          <section class="stats-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Gross Revenue</span>
                <span class="stat-icon success">💰</span>
              </div>
              <div class="stat-value" data-money="${grossRevenue}">—</div>
              <div class="stat-change up">↑ 18.2% vs last period</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Tickets Sold</span>
                <span class="stat-icon">🎫</span>
              </div>
              <div class="stat-value">${totalSold.toLocaleString()}</div>
              <div class="stat-change up">↑ 12.4%</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Pending Proceeds</span>
                <span class="stat-icon warning">⏳</span>
              </div>
              <div class="stat-value" data-money="150000">—</div>
              <div class="stat-change">Awaiting settlement</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">Active Ads</span>
                <span class="stat-icon info">📊</span>
              </div>
              <div class="stat-value">1</div>
              <div class="stat-change">
                <a href="advertisements.html" style="color:inherit;">Manage →</a>
              </div>
            </div>
          </section>

          <section class="mt-8">
            <div class="section-header">
              <div>
                <h3 class="section-title" style="font-size:var(--fs-xl);">Your events</h3>
                <p class="section-subtitle">Track sales and performance.</p>
              </div>
              <a href="my-events.html" class="btn btn-ghost btn-sm">Manage all →</a>
            </div>
            <div class="event-grid" id="myEventsGrid"></div>
          </section>

          <section class="mt-8">
            <div class="section-header">
              <div>
                <h3 class="section-title" style="font-size:var(--fs-xl);">Recent activity</h3>
                <p class="section-subtitle">Latest transactions on your account.</p>
              </div>
              <a href="wallet.html" class="btn btn-ghost btn-sm">View all →</a>
            </div>
            <div class="table-wrap">
              <div class="tx-list" id="recentTransactions"></div>
            </div>
          </section>
        `;

          bindOrganizerLogic(myEvents);
        }

        // =========================================
        // SHARED: WALLET BALANCE DISPLAY
        // =========================================
        function renderWalletDisplays() {
          const cur = PS.getCurrency();
          const balance = PS.wallet.getBalance();
          const pending = 15000;
          const available = balance - pending;

          const heroBalance = document.getElementById("heroBalance");
          if (heroBalance)
            heroBalance.textContent = PS.formatMoney(balance, cur);
          const heroAvail = document.getElementById("heroAvailable");
          if (heroAvail) heroAvail.textContent = PS.formatMoney(available, cur);
          const heroPend = document.getElementById("heroPending");
          if (heroPend) heroPend.textContent = PS.formatMoney(pending, cur);

          PS.qsa("[data-money]").forEach((el) => {
            const base = parseFloat(el.dataset.money);
            if (!isNaN(base)) el.textContent = PS.formatMoney(base, cur);
          });
        }

        document.addEventListener("ps:currencychange", renderWalletDisplays);

        // =========================================
        // ATTENDEE LOGIC
        // =========================================
        function bindAttendeeLogic() {
          const cur = PS.getCurrency();

          // Upcoming events from tickets
          const upcoming = window.PS_DATA.DEMO_TICKETS.filter(
            (t) => t.status === "valid",
          );
          const upWrap = document.getElementById("upcomingEvents");
          if (upcoming.length === 0) {
            upWrap.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 010-6h20a3 3 0 010 6M2 15a3 3 0 000 6h20a3 3 0 000-6M2 9v6M22 9v6"/></svg>
              </div>
              <h3 class="empty-state-title">No upcoming events</h3>
              <p class="empty-state-text">You haven't purchased any tickets yet.</p>
              <a href="events.html" class="btn btn-primary">Discover events</a>
            </div>`;
          } else {
            upWrap.innerHTML = upcoming
              .slice(0, 3)
              .map((t) => {
                const ev =
                  window.PS_DATA.DEMO_EVENTS.find((e) => e.id === t.eventId) ||
                  {};
                return `
              <article class="event-card" onclick="window.location.href='ticket-details.html?id=${t.id}'">
                <div class="event-card-media">
                  <div class="event-card-media-placeholder">${ev.emoji || "🎫"}</div>
                  <div class="event-card-badges"><span class="badge badge-success">Valid</span></div>
                </div>
                <div class="event-card-body">
                  <div class="event-card-date">${PS.formatDate(t.date)} · ${PS.formatTime(t.date)}</div>
                  <div class="event-card-title">${t.eventTitle}</div>
                  <div class="event-card-meta">
                    <div class="event-card-meta-row">📍 ${ev.city || ""}, ${(ev.state || "").replace(" (FCT)", "")}</div>
                  </div>
                  <div class="event-card-footer">
                    <div class="event-card-price">${t.ticketType}<span class="event-card-price-label">ticket</span></div>
                    <span class="badge badge-primary">View</span>
                  </div>
                </div>
              </article>`;
              })
              .join("");
          }

          // Recommended events
          const recommended = window.PS_DATA.DEMO_EVENTS.filter(
            (e) => e.featured || e.trending,
          ).slice(0, 3);
          document.getElementById("recommendedEvents").innerHTML = recommended
            .map(
              (ev) => `
          <article class="event-card" onclick="window.location.href='event-details.html?id=${ev.id}'">
            <div class="event-card-media">
              <div class="event-card-media-placeholder">${ev.emoji}</div>
              <div class="event-card-badges">
                ${ev.trending ? '<span class="badge badge-primary">🔥 Trending</span>' : ""}
                ${ev.featured ? '<span class="badge badge-info">Featured</span>' : ""}
              </div>
            </div>
            <div class="event-card-body">
              <div class="event-card-date">${PS.formatDate(ev.date)} · ${PS.formatTime(ev.date)}</div>
              <div class="event-card-title">${ev.title}</div>
              <div class="event-card-meta">
                <div class="event-card-meta-row">📍 ${ev.city}, ${ev.state.replace(" (FCT)", "")}</div>
              </div>
              <div class="event-card-footer">
                <div class="event-card-price" data-money="${ev.price}">${PS.formatMoney(ev.price, cur)}<span class="event-card-price-label">from</span></div>
              </div>
            </div>
          </article>
        `,
            )
            .join("");

          // Recent transactions
          renderRecentTx();

          // Favorites count
          document.getElementById("favCount").textContent =
            PS.favorites.all().length;

          // Wallet displays
          renderWalletDisplays();
        }

        // =========================================
        // ORGANIZER LOGIC
        // =========================================
        function bindOrganizerLogic(myEvents) {
          const cur = PS.getCurrency();

          document.getElementById("myEventsGrid").innerHTML = myEvents
            .slice(0, 3)
            .map((ev) => {
              const revenue = ev.price * ev.sold;
              const pct = (ev.sold / ev.capacity) * 100;
              return `
            <article class="event-card" onclick="window.location.href='event-details.html?id=${ev.id}'">
              <div class="event-card-media">
                <div class="event-card-media-placeholder">${ev.emoji}</div>
                <div class="event-card-badges"><span class="badge badge-success">Published</span></div>
              </div>
              <div class="event-card-body">
                <div class="event-card-date">${PS.formatDate(ev.date)}</div>
                <div class="event-card-title">${ev.title}</div>
                <div class="progress" style="margin-top:var(--space-2);">
                  <div class="progress-bar" style="width:${pct}%;"></div>
                </div>
                <div class="flex justify-between text-xs text-muted">
                  <span>${ev.sold.toLocaleString()} sold</span>
                  <span>${ev.capacity.toLocaleString()} cap</span>
                </div>
                <div class="event-card-footer">
                  <div class="event-card-price" data-money="${revenue}">${PS.formatMoney(revenue, cur)}<span class="event-card-price-label">revenue</span></div>
                </div>
              </div>
            </article>`;
            })
            .join("");

          // Recent transactions
          renderRecentTx();

          // Wallet displays
          renderWalletDisplays();
        }

        // =========================================
        // SHARED: RECENT TRANSACTIONS
        // =========================================
        function renderRecentTx() {
          const cur = PS.getCurrency();
          const recent = window.PS_DATA.DEMO_TRANSACTIONS.slice(0, 5);
          document.getElementById("recentTransactions").innerHTML = recent
            .map((tx) => {
              const isIn = tx.amount > 0;
              return `
            <div class="tx-row" onclick="window.location.href='payments.html?id=${tx.id}'">
              <div class="tx-icon ${isIn ? "in" : "out"}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  ${isIn ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}
                </svg>
              </div>
              <div class="tx-main">
                <div class="tx-title">${tx.description}</div>
                <div class="tx-meta">${tx.type} · ${PS.formatDateTime(tx.date)}</div>
              </div>
              <div class="tx-amount ${isIn ? "in" : "out"}">${PS.formatMoney(tx.amount, cur)}</div>
            </div>`;
            })
            .join("");
        }

        // Logout handling
        const openLogout = () => PS.openModal("logoutModal");
        document
          .getElementById("logoutBtn")
          ?.addEventListener("click", openLogout);
        document
          .getElementById("logoutBtn2")
          ?.addEventListener("click", openLogout);
        document
          .getElementById("confirmLogout")
          .addEventListener("click", () => PS.session.logout());

        // Mobile menu
        if (window.innerWidth <= 860) {
          const mb = document.getElementById("mobileMenuBtn");
          if (mb) mb.style.display = "flex";
        }
      });
    </script>
  </body>
</html>
